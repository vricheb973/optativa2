<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Panel de gestión para DAW Pizza — administra pizzas, clientes, direcciones y pedidos." />
  <title>DAW Pizza — Panel de Gestión</title>

  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <!-- Custom CSS -->
  <link href="css/styles.css" rel="stylesheet" />
</head>
<body data-bs-theme="dark">

  <!-- Mobile sidebar toggle -->
  <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Abrir menú">
    <i class="bi bi-list"></i>
  </button>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="app-wrapper">
    <!-- ===== Sidebar ===== -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">🍕</div>
        <div>
          <h1>DAW Pizza</h1>
          <small>Panel de gestión</small>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-item active" data-page="dashboard" id="nav-dashboard">
          <i class="bi bi-grid-1x2-fill"></i>
          <span>Dashboard</span>
        </div>
        <div class="nav-item" data-page="pizzas" id="nav-pizzas">
          <i class="bi bi-circle-fill" style="font-size:0.6rem;color:var(--accent)"></i>
          <span>Pizzas</span>
        </div>
        <div class="nav-item" data-page="clientes" id="nav-clientes">
          <i class="bi bi-people-fill"></i>
          <span>Clientes</span>
        </div>
        <div class="nav-item" data-page="direcciones" id="nav-direcciones">
          <i class="bi bi-geo-alt-fill"></i>
          <span>Direcciones</span>
        </div>
        <div class="nav-item" data-page="pedidos" id="nav-pedidos">
          <i class="bi bi-receipt"></i>
          <span>Pedidos</span>
        </div>
      </nav>

      <div class="sidebar-footer">
        &copy; 2025 DAW Pizza &mdash; Spring Boot 3
      </div>
    </aside>

    <!-- ===== Main Content ===== -->
    <main class="main-content" id="main-content">
      <!-- Dynamic content injected here -->
    </main>
  </div>

  <!-- ===== Modal Genérico ===== -->
  <div class="modal fade" id="formModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="formModalTitle"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body" id="formModalBody">
          <!-- Dynamic form injected here -->
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-ghost" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn-accent" id="formModalSave">
            <i class="bi bi-check-lg"></i> Guardar
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== Modal Confirmar Eliminación ===== -->
  <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-exclamation-triangle text-danger-custom"></i> Confirmar eliminación</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <p id="deleteModalMsg" style="color:var(--text-secondary);font-size:0.9rem;margin:0;">¿Estás seguro de que deseas eliminar este registro?</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-ghost" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn-accent" id="deleteModalConfirm" style="background:linear-gradient(135deg,var(--danger),#c44);">
            <i class="bi bi-trash3"></i> Eliminar
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- App Scripts -->
  <script src="js/api.js"></script>
  <script src="js/pizzas.js"></script>
  <script src="js/clientes.js"></script>
  <script src="js/direcciones.js"></script>
  <script src="js/pedidos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
